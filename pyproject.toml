[project]
name = "botlinkedin"
version = "0.1.0"
description = "AI-powered job application automation agent"
requires-python = ">=3.11"

dependencies = [
    "playwright>=1.49",
    "playwright-stealth>=1.0",
    "anthropic>=0.93",
    "pdfplumber>=0.11",
    "PyMuPDF>=1.25",
    "python-jobspy>=1.1",
    "beautifulsoup4>=4.12",
    "httpx>=0.28",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "typer>=0.15",
    "rich>=13.9",
    "python-dotenv>=1.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "thefuzz>=0.22",
    "cryptography>=44.0",
    "tenacity>=9.0",
    "fpdf2>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]
# Optional backend: route AI generation through the Claude Agent SDK
# (set AI_BACKEND=agent). Requires the Claude Code CLI on PATH.
agent = [
    "claude-agent-sdk>=0.2",
]

[project.scripts]
botlinkedin = "src.main:app"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
