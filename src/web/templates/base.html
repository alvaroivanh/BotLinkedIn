<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BotLinkedIn{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>💼</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background: #f5f7fa; color: #1d2433; }
        h2 { font-weight: 700; letter-spacing: -0.01em; font-size: 1.6rem; }
        .sidebar { background: #1a1a2e; min-height: 100vh; padding-top: 1rem; }
        .sidebar a { color: #a0a0b0; text-decoration: none; padding: 0.75rem 1.5rem; display: block; transition: 0.2s; }
        .sidebar a:hover, .sidebar a.active { color: #fff; background: rgba(255,255,255,0.08); }
        .sidebar .brand { color: #0a66c2; font-weight: bold; font-size: 1.3rem; padding: 1rem 1.5rem; }
        .stat-card { border: none; border-radius: 12px; transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-2px); }
        .stat-value { font-size: 2rem; font-weight: 700; }
        .content-area { padding: 2rem; }
        /* KPI cards (Dashboard) */
        .kpi { border: none; border-radius: 14px; background: #fff; box-shadow: 0 1px 3px rgba(16,24,40,.07); transition: transform .2s; }
        .kpi:hover { transform: translateY(-2px); }
        .kpi .stat-value { font-size: 1.9rem; line-height: 1; }
        .kpi .kpi-label { color: #667085; font-size: .85rem; }
        .kpi .kpi-icon { width: 46px; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.35rem; flex-shrink: 0; }
        .kpi.kpi-hero { background: linear-gradient(135deg, #0a66c2, #0a4f96); color: #fff; }
        .kpi.kpi-hero .kpi-label { color: rgba(255,255,255,.85); }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-2 sidebar d-none d-md-block">
                <div class="brand"><i class="bi bi-linkedin"></i> BotLinkedIn</div>
                <hr style="border-color: #333;">
                <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">
                    <i class="bi bi-speedometer2"></i> Dashboard
                </a>
                <a href="/jobs" class="{% if request.url.path == '/jobs' %}active{% endif %}">
                    <i class="bi bi-briefcase"></i> Empleos
                </a>
                <a href="/applications" class="{% if request.url.path == '/applications' %}active{% endif %}">
                    <i class="bi bi-send"></i> Aplicaciones
                </a>
                <a href="/letters" class="{% if request.url.path == '/letters' %}active{% endif %}">
                    <i class="bi bi-envelope-paper"></i> Cartas
                </a>
                <a href="/chat" class="{% if request.url.path == '/chat' %}active{% endif %}">
                    <i class="bi bi-robot"></i> Asistente
                </a>
            </nav>

            <!-- Main content -->
            <main class="col-md-10 content-area">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <!-- Global toast container + helper (replaces blocking alert() for feedback) -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:1090" id="toastContainer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        window.showToast = function (message, type) {
            type = type || 'primary';
            const container = document.getElementById('toastContainer');
            const el = document.createElement('div');
            el.className = 'toast align-items-center text-bg-' + type + ' border-0';
            el.setAttribute('role', 'alert');
            el.innerHTML =
                '<div class="d-flex"><div class="toast-body">' + message + '</div>'
                + '<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>';
            container.appendChild(el);
            const toast = new bootstrap.Toast(el, { delay: 4500 });
            toast.show();
            el.addEventListener('hidden.bs.toast', () => el.remove());
        };
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
