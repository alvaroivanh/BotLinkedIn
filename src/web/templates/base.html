<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BotLinkedIn{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background: #f5f7fa; }
        .sidebar { background: #1a1a2e; min-height: 100vh; padding-top: 1rem; }
        .sidebar a { color: #a0a0b0; text-decoration: none; padding: 0.75rem 1.5rem; display: block; transition: 0.2s; }
        .sidebar a:hover, .sidebar a.active { color: #fff; background: rgba(255,255,255,0.08); }
        .sidebar .brand { color: #0a66c2; font-weight: bold; font-size: 1.3rem; padding: 1rem 1.5rem; }
        .stat-card { border: none; border-radius: 12px; transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-2px); }
        .stat-value { font-size: 2rem; font-weight: 700; }
        .content-area { padding: 2rem; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-2 sidebar d-none d-md-block">
                <div class="brand"><i class="bi bi-linkedin"></i> BotLinkedIn</div>
                <hr style="border-color: #333;">
                <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">
                    <i class="bi bi-speedometer2"></i> Dashboard
                </a>
                <a href="/jobs" class="{% if request.url.path == '/jobs' %}active{% endif %}">
                    <i class="bi bi-briefcase"></i> Empleos
                </a>
                <a href="/applications" class="{% if request.url.path == '/applications' %}active{% endif %}">
                    <i class="bi bi-send"></i> Aplicaciones
                </a>
                <a href="/letters" class="{% if request.url.path == '/letters' %}active{% endif %}">
                    <i class="bi bi-envelope-paper"></i> Cartas
                </a>
            </nav>

            <!-- Main content -->
            <main class="col-md-10 content-area">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
